name: Cross-runtime differential CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: differential-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: JS and PHP mutation conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom
          coverage: none
      - name: Pin npm for lockfile consistency
        run: npm install --global npm@10.9.2
      - run: npm ci --ignore-scripts
      - run: composer install --no-interaction --prefer-dist
        working-directory: php
      - run: npm run build
      - run: npm run test:differential
