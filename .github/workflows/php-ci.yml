name: PHP CI

on:
  pull_request:
    paths: ['php/**', 'spec/corpus/**', 'spec/schemas/**', '.github/workflows/php-ci.yml']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: php
      - run: composer analyse
        working-directory: php
      - run: composer format-check
        working-directory: php
      - run: composer test
        working-directory: php
