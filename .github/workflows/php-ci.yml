name: PHP CI

on:
  pull_request:
    paths: ['php/**', 'spec/corpus/**', 'spec/schemas/**', '.github/workflows/php-ci.yml']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: dom
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: php
      - run: composer analyse
        working-directory: php
      - run: composer format-check
        working-directory: php
      - run: composer test
        working-directory: php
      - run: composer test:no-zlib
        working-directory: php
      - run: composer test:no-dom
        working-directory: php
      - run: composer test:examples
        working-directory: php
      - run: composer audit --no-interaction
        working-directory: php
      - name: Build and inspect Composer package archive
        working-directory: php
        run: |
          archive_directory="$(mktemp -d)"
          composer archive --format=zip --dir="$archive_directory"
          archive_file="$(find "$archive_directory" -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$archive_file"
          archive_entries="$(unzip -Z1 "$archive_file")"
          printf '%s\n' "$archive_entries" | grep -Fx 'src/Scanner.php'
          printf '%s\n' "$archive_entries" | grep -Fx 'examples/scan-file.php'
          if printf '%s\n' "$archive_entries" | grep -Eq '(^|/)(vendor|tests|fuzz|scripts)/|(^|/)(composer\.lock|\.phpunit\.result\.cache|\.php-cs-fixer\.cache)$'; then
            echo 'The Composer archive contains development or local cache files.' >&2
            exit 1
          fi
