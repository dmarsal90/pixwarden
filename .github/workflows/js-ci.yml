name: JS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: js-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm for lockfile consistency
        run: npm install --global npm@10.9.2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/smoke-js-example.mjs
      - run: npm run check:package
      - run: npm run typecheck
      - run: npm test
      - name: Replay shared seed corpus with Jazzer.js
        run: |
          fuzz_corpus="$RUNNER_TEMP/pixwarden-fuzz-regression"
          mkdir -p "$fuzz_corpus"
          node scripts/prepare-fuzz-corpus.mjs "$fuzz_corpus"
          npx jazzer fuzz/scan-image.mjs "$fuzz_corpus" --timeout=1000 --mode=regression
      - run: npm audit --audit-level=high
