name: PHP coverage-guided fuzzing

on:
  pull_request:
    paths: ['php/**', 'spec/corpus/**', '.github/workflows/php-fuzz.yml']
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: PHP 8.4 parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: php
      - name: Prepare hash-checked shared corpus
        run: |
          mkdir -p "$RUNNER_TEMP/pixwarden-php-fuzz/corpus"
          php php/scripts/prepare-fuzz-corpus.php "$RUNNER_TEMP/pixwarden-php-fuzz/corpus"
      - name: Fuzz the bounded PHP scanner
        env:
          FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '1000' || '100000' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            php php/vendor/bin/php-fuzzer fuzz --max-runs "$FUZZ_RUNS" --timeout 1 php/fuzz/scan-image.php "$RUNNER_TEMP/pixwarden-php-fuzz/corpus"
          else
            if timeout --signal=INT --kill-after=5s 90s php php/vendor/bin/php-fuzzer fuzz --timeout 1 php/fuzz/scan-image.php "$RUNNER_TEMP/pixwarden-php-fuzz/corpus"; then
              exit 0
            else
              status=$?
              if [ "$status" -ne 124 ]; then
                exit "$status"
              fi
            fi
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pixwarden-php-fuzz-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/pixwarden-php-fuzz/
          if-no-files-found: warn
          retention-days: 14
